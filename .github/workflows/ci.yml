name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Zero-cost: all three suites use mock spawn and never touch ZCode,
      # never consume plan credits. The real call lives in scripts/e2e-smoke.mjs
      # and is intentionally NOT run in CI (it needs ZCode + a paid plan key).
      - name: Run test suites
        run: npm test

      # Syntax-check every library module and script. Done in Node (not a shell
      # loop) so the same command works on the PowerShell and bash runners
      # without shell-specific globbing.
      - name: Syntax-check library and scripts
        run: |
          node -e "
          const { readdirSync } = require('fs');
          const files = [
            ...readdirSync('lib').filter(f => f.endsWith('.js')).map(f => 'lib/' + f),
            ...readdirSync('scripts').filter(f => f.endsWith('.mjs')).map(f => 'scripts/' + f),
            ...readdirSync('test').filter(f => f.endsWith('.mjs')).map(f => 'test/' + f),
          ];
          const { execFileSync } = require('child_process');
          for (const f of files) {
            execFileSync(process.execPath, ['--check', f], { stdio: 'inherit' });
          }
          console.log('syntax OK:', files.length, 'files');
          "

      - name: Import smoke test (library surface)
        run: node -e "import('./lib/index.js').then(m => { const need = ['name','inject','apply']; const miss = need.filter(k => !(k in m)); if (miss.length) { console.error('missing exports:', miss); process.exit(1); } console.log('exports OK:', need.join(', ')); })"
